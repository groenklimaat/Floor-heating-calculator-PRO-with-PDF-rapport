<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e4b56"/>
      <stop offset="1" stop-color="#1f7a86"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- floor heating coil -->
  <path d="M10 20h30a6 6 0 0 1 0 12H20a6 6 0 0 0 0 12h34"
        fill="none" stroke="#e1f0f3" stroke-width="4" stroke-linecap="round"/>
  <!-- supply dot (warm) -->
  <circle cx="10" cy="20" r="4" fill="#ff9d4d"/>
  <!-- return dot (cool) -->
  <circle cx="54" cy="44" r="4" fill="#7fd3e0"/>
</svg>